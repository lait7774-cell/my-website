<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartSpend | 萌寵連續登入豪華版</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #e67e22;
            --secondary: #fff9db;
            --accent: #ff8787;
            --success: #51cf66;
            --danger: #ff6b6b;
            --bg: #fff5f5;
            --glass: rgba(255, 255, 255, 0.7);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, #fff9db 0%, #fff5f5 100%);
            background-attachment: fixed;
            margin: 0;
            padding: 20px;
            color: #495057;
            min-height: 100vh;
        }

        .dashboard {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 20px;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 30px;
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(230, 126, 34, 0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px 0 rgba(230, 126, 34, 0.15);
        }

        .col-12 { grid-column: span 12; }
        .col-8 { grid-column: span 8; }
        .col-4 { grid-column: span 4; }

        .header-card {
            text-align: center;
            background: linear-gradient(45deg, #f0932b, #ed4c67);
            color: white;
            border: none;
        }

        .header-card h1 {
            font-size: 2.2rem;
            margin: 10px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        /* --- 寵物區域與等級系統 --- */
        .pet-stage {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 15px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            transition: all 0.5s;
        }

        .pet-stage.master-glow {
            box-shadow: 0 0 30px #f1c40f, inset 0 0 15px #f39c12;
            animation: pulse-glow 2s infinite;
        }

        @keyframes pulse-glow {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); box-shadow: 0 0 45px #f1c40f; }
            100% { transform: scale(1); }
        }

        .level-badge {
            position: absolute;
            top: -10px;
            right: -10px;
            background: #fff;
            color: var(--primary);
            padding: 5px 12px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 0.9rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border: 2px solid var(--primary);
            z-index: 10;
        }

        /* 連續登入火苗標籤 */
        .streak-info {
            position: absolute;
            bottom: -5px;
            left: -10px;
            background: #fff;
            color: #f76707;
            padding: 5px 12px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 0.85rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border: 2px solid #ffd8a8;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .accessory {
            position: absolute;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0;
            transform: scale(0);
            pointer-events: none;
        }

        .accessory.unlocked { opacity: 1; transform: scale(1); }
        #acc-crown { top: -20px; left: 45px; font-size: 3.5rem; transform: rotate(-15deg); }
        #acc-sunglasses { top: 40px; left: 35px; font-size: 3rem; }

        /* --- 統計看板 --- */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .stat-box {
            padding: 20px;
            border-radius: 20px;
            background: white;
            text-align: center;
        }

        .stat-label { font-size: 0.85rem; color: #adb5bd; margin-bottom: 8px; font-weight: 600; }
        .stat-value { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.5px; }

        /* --- 輸入表單 --- */
        .input-group { display: flex; flex-direction: column; gap: 15px; }

        input, select {
            background: white;
            border: 2px solid #f1f3f5;
            padding: 15px;
            border-radius: 16px;
            font-size: 1rem;
            transition: all 0.2s;
            color: #495057;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(230, 126, 34, 0.1);
            outline: none;
        }

        .btn-main {
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(230, 126, 34, 0.3);
            transition: all 0.2s;
        }

        .btn-main:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(230, 126, 34, 0.4); }

        .btn-outline {
            background: white;
            color: var(--primary);
            border: 2px solid var(--primary);
            padding: 8px 15px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        /* --- 歷史清單 --- */
        .history-list { margin-top: 20px; }
        .history-item {
            background: white;
            margin-bottom: 12px;
            padding: 18px;
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #f1f3f5;
            transition: transform 0.2s ease;
        }
        
        .history-item:hover { transform: scale(1.01); border-color: var(--primary); }

        .history-tag {
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 4px;
            display: inline-block;
        }

        .tag-exp { background: #fff5f5; color: var(--danger); }
        .tag-inc { background: #ebfbee; color: var(--success); }

        .history-right { display: flex; align-items: center; gap: 15px; }

        .btn-delete {
            background: #f8f9fa;
            border: none;
            color: #adb5bd;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 8px;
            border-radius: 12px;
            transition: all 0.2s;
        }

        .btn-delete:hover { color: var(--danger); background: #fff5f5; transform: rotate(10deg); }
    </style>
</head>
<body>

<div class="dashboard">
    <!-- 1. 豪華標題與阿柴 -->
    <div class="card col-12 header-card">
        <div class="pet-stage" id="pet-stage">
            <div class="level-badge" id="lv-badge">Lv.1 初心柴</div>
            <div class="streak-info">🔥 <span id="streak-days">1</span> 天</div>
            <span id="pet-main">🐕</span>
            <span id="acc-crown" class="accessory">👑</span>
            <span id="acc-sunglasses" class="accessory">🕶️</span>
        </div>
        <h1>SmartSpend 萌寵成長室</h1>
        <p id="growth-text">汪！每天來報到，阿柴會變更強喔！✨</p>
    </div>

    <!-- 2. 月度數據看板 -->
    <div class="card col-12">
        <div style="display: flex; gap: 10px; margin-bottom: 20px; justify-content: center;">
            <select id="year-filter" onchange="updateUI()"></select>
            <select id="month-filter" onchange="updateUI()">
                <option value="01">1月</option><option value="02">2月</option>
                <option value="03">3月</option><option value="04">4月</option>
                <option value="05">5月</option><option value="06">6月</option>
                <option value="07">7月</option><option value="08">8月</option>
                <option value="09">9月</option><option value="10">10月</option>
                <option value="11">11月</option><option value="12">12月</option>
            </select>
        </div>
        <div class="summary-grid">
            <div class="stat-box">
                <div class="stat-label">本月收入</div>
                <div class="stat-value" style="color: var(--success)" id="total-income">$0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">本月支出</div>
                <div class="stat-value" style="color: var(--danger)" id="total-expense">$0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">當月剩餘</div>
                <div class="stat-value" style="color: var(--primary)" id="total-balance">$0</div>
            </div>
        </div>
    </div>

    <!-- 3. 新增紀錄 -->
    <div class="card col-4">
        <h2 style="margin: 0 0 20px 0; font-size: 1.2rem;">✒️ 新增紀錄</h2>
        <div class="input-group">
            <select id="type">
                <option value="支出">💸 支出肉肉</option>
                <option value="收入">💰 獲得肉肉</option>
            </select>
            <input type="date" id="record-date">
            <input type="text" id="desc" placeholder="項目名稱 (如: 買玩具)">
            <input type="number" id="amount" placeholder="金額 (骨頭)">
            <select id="category">
                <option value="餐飲">🍱 美食餐飲</option>
                <option value="交通">🚗 汪汪出門</option>
                <option value="娛樂">🎮 玩耍玩具</option>
                <option value="薪水">💵 勞動所得</option>
                <option value="其他">✨ 其他項目</option>
            </select>
            <button class="btn-main" onclick="addRecord()">🐶 記一筆帳！</button>
        </div>
    </div>

    <!-- 4. 圖表分析 -->
    <div class="card col-8">
        <h2 style="margin: 0 0 20px 0; font-size: 1.2rem;">📊 支出分佈</h2>
        <div style="height: 300px; display: flex; align-items: center; justify-content: center;">
            <canvas id="expenseChart"></canvas>
        </div>
    </div>

    <!-- 5. 歷史足跡 -->
    <div class="card col-12">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="margin: 0; font-size: 1.2rem;">📜 散步足跡</h2>
            <div style="display: flex; gap: 10px;">
                <button class="btn-outline" onclick="exportData()">📤 匯出 CSV</button>
                <button onclick="clearAll()" style="background: none; border: none; color: #adb5bd; cursor: pointer; text-decoration: underline; font-size: 0.8rem;">清除所有數據</button>
            </div>
        </div>
        <div id="history" class="history-list"></div>
    </div>
</div>

<script>
    const STORAGE_KEY = 'smartspend_deluxe_v1';
    const STREAK_KEY = 'smartspend_streak_v1';
    
    let records = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    let streakData = JSON.parse(localStorage.getItem(STREAK_KEY)) || { count: 0, lastDate: "" };
    let expenseChart;

    window.onload = () => {
        const now = new Date();
        // 處理登入天數邏輯
        processLoginStreak(now);
        
        document.getElementById('record-date').value = now.toISOString().split('T')[0];
        initYearFilter(now.getFullYear());
        document.getElementById('month-filter').value = String(now.getMonth() + 1).padStart(2, '0');
        initChart();
        updateUI();
    };

    // --- 連續登入計算邏輯 ---
    function processLoginStreak(today) {
        const todayStr = today.toISOString().split('T')[0];
        const lastStr = streakData.lastDate;

        if (lastStr === "") {
            // 第一次使用
            streakData.count = 1;
        } else if (lastStr === todayStr) {
            // 今天已經算過了，不做事
        } else {
            const lastDate = new Date(lastStr);
            const diffTime = Math.abs(today - lastDate);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays <= 1.5) { // 判斷是否為「隔天」
                streakData.count += 1;
            } else {
                // 超過一天沒登入，重置
                streakData.count = 1;
            }
        }
        streakData.lastDate = todayStr;
        localStorage.setItem(STREAK_KEY, JSON.stringify(streakData));
        document.getElementById('streak-days').innerText = streakData.count;
    }

    function initYearFilter(curr) {
        const select = document.getElementById('year-filter');
        for(let y=2024; y<=2030; y++) {
            const opt = new Option(`${y}年`, y);
            if(y === curr) opt.selected = true;
            select.add(opt);
        }
    }

    function initChart() {
        const ctx = document.getElementById('expenseChart').getContext('2d');
        expenseChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['餐飲', '交通', '娛樂', '薪水', '其他'],
                datasets: [{
                    data: [0, 0, 0, 0, 0],
                    backgroundColor: ['#ff8787', '#74c0fc', '#ffc078', '#63e6be', '#ced4da'],
                    borderWidth: 0,
                    hoverOffset: 20
                }]
            },
            options: {
                maintainAspectRatio: false,
                plugins: { legend: { position: 'right' } },
                cutout: '70%'
            }
        });
    }

    function addRecord() {
        const date = document.getElementById('record-date').value;
        const desc = document.getElementById('desc').value;
        const amount = parseInt(document.getElementById('amount').value);
        const category = document.getElementById('category').value;
        const type = document.getElementById('type').value;

        if(!desc || isNaN(amount)) return alert("汪！主人的資料還沒填齊喔！");

        records.push({ id: Date.now(), date, desc, amount, category, type });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
        
        document.getElementById('desc').value = '';
        document.getElementById('amount').value = '';
        updateUI();
    }

    function deleteRecord(id) {
        if(confirm("汪！真的要把這筆足跡擦掉嗎？")) {
            records = records.filter(r => r.id !== id);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
            updateUI();
        }
    }

    function updateUI() {
        const y = document.getElementById('year-filter').value;
        const m = document.getElementById('month-filter').value;
        const filterStr = `${y}-${m}`;
        
        const filtered = records.filter(r => r.date.startsWith(filterStr));
        const historyDiv = document.getElementById('history');
        historyDiv.innerHTML = '';
        
        let inc = 0, exp = 0;
        let cats = { '餐飲':0, '交通':0, '娛樂':0, '薪水':0, '其他':0 };

        filtered.sort((a,b) => b.id - a.id).forEach(r => {
            if(r.type === '收入') inc += r.amount; 
            else {
                exp += r.amount;
                cats[r.category] = (cats[r.category] || 0) + r.amount;
            }

            historyDiv.innerHTML += `
                <div class="history-item">
                    <div>
                        <span class="history-tag ${r.type==='收入'?'tag-inc':'tag-exp'}">${r.category}</span>
                        <div style="font-weight: 700;">${r.desc}</div>
                        <div style="font-size: 0.75rem; color: #adb5bd;">${r.date}</div>
                    </div>
                    <div class="history-right">
                        <div class="stat-value" style="color: ${r.type==='收入'?'var(--success)':'var(--danger)'}">
                            ${r.type==='收入'?'+':'-'}$${r.amount}
                        </div>
                        <button class="btn-delete" onclick="deleteRecord(${r.id})">🗑️</button>
                    </div>
                </div>
            `;
        });

        document.getElementById('total-income').innerText = `$${inc}`;
        document.getElementById('total-expense').innerText = `$${exp}`;
        document.getElementById('total-balance').innerText = `$${inc - exp}`;

        expenseChart.data.datasets[0].data = Object.values(cats);
        expenseChart.update();

        // 阿柴狀態更新
        updatePetAndLevel(inc, exp);
    }

    function updatePetAndLevel(inc, exp) {
        const crown = document.getElementById('acc-crown');
        const sun = document.getElementById('acc-sunglasses');
        const text = document.getElementById('growth-text');
        const stage = document.getElementById('pet-stage');
        const badge = document.getElementById('lv-badge');
        const balance = inc - exp;

        // --- 根據連續登入天數解鎖配件 ---
        // 3天解鎖墨鏡
        if(streakData.count >= 3) sun.classList.add('unlocked');
        else sun.classList.remove('unlocked');

        // 7天解鎖皇冠
        if(streakData.count >= 7) crown.classList.add('unlocked');
        else crown.classList.remove('unlocked');

        // --- 心情邏輯 ---
        if(balance < 0) {
            document.getElementById('pet-main').innerText = "🥺";
            text.innerText = "汪...骨頭透支了，我們要節約一點喔！";
        } else {
            document.getElementById('pet-main').innerText = "🐕";
        }

        // --- 等級進化邏輯 (基於連續登入天數) ---
        const days = streakData.count;
        let lv = 1, lvName = "初心柴";

        if (days >= 30) {
            lv = 4; lvName = "恆心大師";
            stage.classList.add('master-glow');
        } else if (days >= 7) {
            lv = 3; lvName = "自律柴";
            stage.classList.remove('master-glow');
        } else if (days >= 3) {
            lv = 2; lvName = "熱血柴";
            stage.classList.remove('master-glow');
        } else {
            lv = 1; lvName = "初心柴";
            stage.classList.remove('master-glow');
        }

        badge.innerText = `Lv.${lv} ${lvName}`;
        
        // 特殊對話更新
        if (days >= 30) {
            text.innerText = "汪！主人已經堅持了 30 天，你就是阿柴心目中的大師！👑";
        } else if (days >= 1) {
            if (balance >= 0) text.innerText = `汪！連續登入第 ${days} 天，今天也要加油記帳喔！✨`;
        }
    }

    function exportData() {
        if(records.length === 0) return alert("汪！目前沒有任何紀錄可以匯出喔！");
        let csvContent = "日期,類型,類別,項目名稱,金額\n";
        const sortedRecords = [...records].sort((a,b) => a.date.localeCompare(b.date));
        sortedRecords.forEach(r => {
            csvContent += `${r.date},${r.type},${r.category},${r.desc},${r.amount}\n`;
        });
        const blob = new Blob(["\ufeff" + csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `阿柴帳本匯出_${new Date().toISOString().split('T')[0]}.csv`);
        link.click();
    }

    function clearAll() {
        if(confirm("汪！確定要清除所有紀錄嗎？（連續登入天數會保留喔！）")) {
            records = [];
            localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
            updateUI();
        }
    }
</script>
</body>
</html>
